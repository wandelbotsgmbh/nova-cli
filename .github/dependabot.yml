version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
  # template that `nova app create` copies into new NextJS apps
  - package-ecosystem: npm
    directory: /pkg/generator/NextJsApp
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      nextjs-template:
        update-types: [minor, patch]

name: Templates

# Generates an app from every template with the CLI of this commit, runs the
# checks a developer of that app would run, and builds its image (the same
# 'docker buildx build' of the app as 'nova app install', not nova's build
# code). The e2e test only covers the default (python) app, and the templates'
# dependencies move on their own (version ranges, no Python lockfile), so this
# also runs weekly, without any build cache.
on:
  pull_request:
    paths:
      - pkg/generator/**
      - pkg/appenv/**
      - pkg/cmd/app.go
      - .github/workflows/templates.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# like ci.yml: PRs cancel their older run, main and scheduled runs get one group per commit
concurrency:
  group: templates-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template:
    name: ${{ matrix.generator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        generator: [nextjs_app, python_app, golang_app, rust_app]
    env:
      APP: ${{ github.workspace }}/_generated/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate the app
        run: |
          go build -o "$RUNNER_TEMP/nova" .
          mkdir -p _generated && cd _generated
          # a throwaway HOME: no instance configured, the env file gets placeholders
          HOME=$(mktemp -d) "$RUNNER_TEMP/nova" app create app -g ${{ matrix.generator }}
          ls -la app

      # Next.js: pnpm (the template's Dockerfile version) fetches the Node
      # version from pnpm-workspace.yaml itself.
      - if: matrix.generator == 'nextjs_app'
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - if: matrix.generator == 'nextjs_app'
        working-directory: ${{ env.APP }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm tsc
          pnpm exec knip
          pnpm build

      - if: matrix.generator == 'python_app'
        # setup-uv publishes no moving major tag; Dependabot updates the version
        uses: astral-sh/setup-uv@v10.4.0
      - if: matrix.generator == 'python_app'
        working-directory: ${{ env.APP }}
        run: |
          # the Python of the template's image, not the runner's
          python=$(sed -n 's#^FROM python:\([0-9.]*\).*#\1#p' Dockerfile | head -1)
          [ -n "$python" ] || { echo "::error::no 'FROM python:<version>' in the Dockerfile"; exit 1; }
          uv sync --python "$python"
          uv run ruff check
          uv run ruff format --check
          # ruff doesn't see API changes of the NOVA SDK (a version range): import the app
          uv run python -c "import app.register_programs"

      - if: matrix.generator == 'golang_app'
        uses: actions/setup-go@v7
        with:
          go-version-file: _generated/app/go.mod
          cache-dependency-path: _generated/app/go.sum
      - if: matrix.generator == 'golang_app'
        working-directory: ${{ env.APP }}
        run: |
          go build ./...
          go vet ./...
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted: $unformatted"; exit 1; fi

      # the toolchain of the template's Dockerfile
      - if: matrix.generator == 'rust_app'
        working-directory: ${{ env.APP }}
        run: |
          toolchain=$(sed -n 's#^FROM .*rust:\([0-9][0-9.]*\)-.*#\1#p' Dockerfile | head -1)
          [ -n "$toolchain" ] || { echo "::error::no 'rust:<version>-' image in the Dockerfile"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup override set "$toolchain"
          cargo build --locked
          cargo test --locked
          cargo clippy --locked -- -D warnings
          cargo fmt --check

      # No build cache: it would cost ~1.5 GB of the repo's Actions cache per
      # PR, its export took longer than it saved, and the weekly run must
      # resolve dependencies anew.
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP }}
          push: false

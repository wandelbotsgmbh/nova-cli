name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the older run. main: one group per commit, because
# GitHub keeps only one pending run per group and would cancel the queued one
# when several PRs are merged in a row.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.txt ./...
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}')
          echo "Total coverage: $total"
          echo "**Total coverage:** $total" >> "$GITHUB_STEP_SUMMARY"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Integration tests for the podman container runtime (nova app install /
  # nova model build support podman as an alternative to docker). Runs the
  # build-tagged tests in pkg/docker against a local registry service.
  test-podman:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      NOVA_TEST_REGISTRY: localhost:5000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Configure podman
        run: |
          podman --version
          # the registry service is plain http; mark it insecure for podman push/inspect
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' \
            | sudo tee /etc/containers/registries.conf.d/test-registry.conf
      - run: go test -v -tags integration -run TestPodman ./pkg/docker/

  # Validates the GoReleaser config and that all release archives build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

  # Builds the CLI reference site (deployed on release); download the artifact
  # to preview it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: hack/docsite/build.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site
          include-hidden-files: true
          retention-days: 3

  # Builds the docker image without pushing.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            FLAGS=-X 'github.com/wandelbotsgmbh/nova-cli/pkg/version.cliVersion=ci-${{ github.sha }}'
          push: false

  # Decides whether a PR needs the e2e test. It is skipped only if every changed
  # file is on the skip list (markdown outside pkg/, the docs site, other
  # workflows), so new directories run e2e by default. A skipped required check
  # counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the PR merge commit and its first parent (the base branch)
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          skip='(^|/)[^/]*\.md$|^hack/docsite/|^LICENSE$|^\.github/'
          run='^pkg/|^\.github/workflows/ci\.yml$'
          if grep -Ev "$skip" changed.txt | grep -q . || grep -Eq "$run" changed.txt; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or unrelated workflows changed, skipping e2e." >> "$GITHUB_STEP_SUMMARY"
          fi

  # End-to-end test against a temporary instance on the prod portal: install a
  # cell, create an app and install it. The app image goes to a private GHCR
  # package; `nova app install` hands the docker login to the instance as pull
  # secret. Needs secrets, so it's skipped for fork and Dependabot PRs, and for
  # PRs that only change docs (see changes).
  e2e:
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.e2e == 'true'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'))
    needs: [build, changes]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PORTAL_PROD_REFRESH_TOKEN: ${{ secrets.PORTAL_PROD_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build nova
        run: |
          CGO_ENABLED=0 go build -o bin/nova .
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create cloud instance
        run: |
          nova login --token "$PORTAL_PROD_REFRESH_TOKEN"
          nova instance create --name "nova-cli-ci-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 900
          echo "INSTANCE_HOST=$(nova instance info --host)" >> "$GITHUB_ENV"
      - name: Install cell
        run: |
          cat testdata/cell.yaml
          nova cell install testdata/cell.yaml
      - name: Create and install app
        run: |
          nova config set image-registry ghcr.io/wandelbotsgmbh/nova-cli-e2e
          nova app create your-nova-app
          nova app install your-nova-app
      - name: Check app is reachable
        run: |
          INSTANCE_TOKEN=$(nova login token)
          echo "::add-mask::$INSTANCE_TOKEN"
          export INSTANCE_TOKEN
          . testdata/app_health_check.sh
          check_app_reachability "your-nova-app"
      # every run moves :latest, the previous image stays untagged; keep the newest 10
      - name: Prune old e2e images
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nova-cli-e2e/your-nova-app
          package-type: container
          min-versions-to-keep: 10
      - name: Download diagnosis package
        if: failure()
        run: nova diagnosis download || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnosis-${{ github.run_id }}
          path: diagnosis.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete cloud instance
        if: always()
        run: |
          INSTANCE_ID=$(nova instance info --instanceId) || exit 0
          nova instance delete "$INSTANCE_ID"

  # NovaFlow end-to-end test on its own temporary instance, in parallel to e2e:
  # install NovaFlow via the feature flag, round-trip a flow through
  # push/get/backup/delete/restore, uninstall and reinstall
  # (testdata/novaflow/e2e.sh). Same conditions as e2e.
  e2e-novaflow:
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.e2e == 'true'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'))
    needs: [build, changes]
    timeout-minutes: 45
    env:
      PORTAL_PROD_REFRESH_TOKEN: ${{ secrets.PORTAL_PROD_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build nova
        run: |
          CGO_ENABLED=0 go build -o bin/nova .
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Create cloud instance
        run: |
          nova login --token "$PORTAL_PROD_REFRESH_TOKEN"
          nova instance create --name "nova-cli-ci-flow-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 900
      - name: Test nova flow
        run: testdata/novaflow/e2e.sh
      - name: Download diagnosis package
        if: failure()
        run: nova diagnosis download || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnosis-novaflow-${{ github.run_id }}
          path: diagnosis.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete cloud instance
        if: always()
        run: |
          INSTANCE_ID=$(nova instance info --instanceId) || exit 0
          nova instance delete "$INSTANCE_ID"

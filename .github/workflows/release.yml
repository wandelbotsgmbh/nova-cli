name: Release

# Two channels:
#   main     every merge → x.y.z-rc.N GitHub *prerelease* (archives + docker
#            :x.y.z-rc.N). No Homebrew, winget, docker :latest or docs.
#   release  stable x.y.z, the full chain. The branch is only ever fast-forwarded
#            to a verified commit on main, via the Promote workflow
#            (promote.yml) or `git push origin <sha>:release`.
# `releases/latest` ignores prereleases, so consumers of it (install_nova.sh,
# CI pipelines downloading the latest release) only ever get stable versions.
#
# semantic-release decides the version (from Conventional Commits) and creates
# the tag + a draft GitHub release; GoReleaser attaches the archives and
# publishes the release (so it is never public without assets); Homebrew, winget
# and docker follow.
#
# Publishing is gated by repo variables (Settings → Secrets and variables →
# Actions → Variables). While a variable isn't "true", that step runs as a
# dry run:
#   RELEASE_ENABLED      create tag + GitHub release + upload archives
#   HOMEBREW_ENABLED     push the formula to wandelbotsgmbh/homebrew-wandelbots
#   WINGET_ENABLED       trigger the wandelbotsgmbh/winget-pkgs update
#   DOCKER_PUSH_ENABLED  push ghcr.io/wandelbotsgmbh/nova-cli:{<ver>,latest}
#                        (otherwise pushes only ghcr.io/wandelbotsgmbh/nova-cli:<ver>-snapshot)
#   DOCS_ENABLED         deploy the CLI reference to GitHub Pages (needs Settings →
#                        Pages → Source: "GitHub Actions"); otherwise the site is
#                        only built and kept as workflow artifact

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no tag, release or publishing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SEMANTIC_RELEASE_PACKAGES: >-
    -p semantic-release@25.0.9
    -p @semantic-release/exec@7.1.0
    -p conventional-changelog-conventionalcommits@8.0.0

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: mode
        name: Decide release mode
        run: |
          dry_run=true
          if [ "${{ vars.RELEASE_ENABLED }}" = "true" ] \
            && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/release" ]; } \
            && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; }; then
            dry_run=false
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "**Dry run:** $dry_run" >> "$GITHUB_STEP_SUMMARY"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2086 # SEMANTIC_RELEASE_PACKAGES is a list of args
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            # other branches (manual dry run) aren't configured in .releaserc.json
            branches=()
            case "$GITHUB_REF_NAME" in main|release) ;; *) branches=(--branches "$GITHUB_REF_NAME") ;; esac
            npx --yes $SEMANTIC_RELEASE_PACKAGES semantic-release --dry-run --no-ci "${branches[@]}"
          else
            npx --yes $SEMANTIC_RELEASE_PACKAGES semantic-release
          fi
      - id: version
        name: Read next version
        run: |
          version=$(cat .next-version 2>/dev/null || true)
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "**Next version:** ${version:-none (no release-worthy commits)} (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # real release: build exactly the tag semantic-release created
          ref: ${{ needs.version.outputs.dry_run == 'true' && github.sha || needs.version.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser (snapshot)
        if: env.DRY_RUN == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          NOVA_VERSION: ${{ env.VERSION }}
      - name: GoReleaser
        if: env.DRY_RUN != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      # hack/homebrew and hack/winget expect the archives in bin/
      - name: Collect archives
        run: |
          mkdir -p bin
          cp dist/*.tar.gz dist/*.zip bin/
          if [ "$DRY_RUN" = "true" ]; then
            # snapshot archives carry a -snapshot suffix
            echo "ARCHIVE_VERSION=$VERSION-snapshot" >> "$GITHUB_ENV"
          else
            echo "ARCHIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-${{ env.ARCHIVE_VERSION }}
          path: bin/
          retention-days: 7

      - name: Generate Homebrew formula
        working-directory: hack/homebrew
        run: |
          go run homebrew.go "$ARCHIVE_VERSION" novacli novacli
          cat ../../bin/homebrew/Formula/n/nova.rb
      - name: Push Homebrew formula
        if: env.DRY_RUN != 'true' && env.PRERELEASE != 'true' && vars.HOMEBREW_ENABLED == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/wandelbotsgmbh/homebrew-wandelbots.git" tap
          cp -rf bin/homebrew/* tap/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --allow-empty -m "nova ${VERSION}" -m "from wandelbotsgmbh/nova-cli@${GITHUB_SHA}"
          git push origin main

      - name: Trigger winget update
        if: env.DRY_RUN != 'true' && env.PRERELEASE != 'true' && vars.WINGET_ENABLED == 'true'
        working-directory: hack/winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: go run winget.go "$VERSION" novacli "$WINGET_TOKEN"

  docker:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.dry_run == 'true' && github.sha || needs.version.outputs.version }}
      - id: tags
        name: Decide image tags
        run: |
          image=ghcr.io/wandelbotsgmbh/nova-cli
          if [ "${{ needs.version.outputs.dry_run }}" != "true" ] && [ "${{ vars.DOCKER_PUSH_ENABLED }}" = "true" ]; then
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "tags=$image:$VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "tags=$image:$VERSION,$image:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tags=$image:$VERSION-snapshot" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            FLAGS=-X 'github.com/wandelbotsgmbh/nova-cli/pkg/version.cliVersion=${{ env.VERSION }}'
          tags: ${{ steps.tags.outputs.tags }}
          push: true

  # CLI reference (cobra markdown rendered with the NOVA design system, see
  # hack/docsite) for GitHub Pages.
  docs:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.dry_run == 'true' && github.sha || needs.version.outputs.version }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build site
        run: hack/docsite/build.sh "$VERSION"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  docs-deploy:
    needs: [version, docs]
    if: needs.version.outputs.dry_run != 'true' && needs.version.outputs.prerelease != 'true' && vars.DOCS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

# Builds the release archives, attaches them to the draft GitHub release that
# semantic-release created and publishes it (see .github/workflows/release.yml).
#
# Archive names match the ones published from GitLab, so Homebrew, winget and
# existing download links keep working:
#   novacli_macos_arm64-<ver>.tar.gz, novacli_linux_amd64-<ver>.tar.gz, ...
#   novacli_win64-<ver>.tar.gz + novacli_win64-<ver>.zip
#
# Local check: goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: novacli

builds:
  - id: nova
    binary: nova
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -X 'github.com/wandelbotsgmbh/nova-cli/pkg/version.cliVersion={{ .Version }}'

archives:
  - id: nova
    ids: [nova]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [tar.gz, zip]
    name_template: >-
      novacli_
      {{- if eq .Os "darwin" }}macos_{{ .Arch }}
      {{- else if eq .Os "windows" }}win64
      {{- else }}{{ .Os }}_{{ .Arch }}{{ end }}
      {{- "-" }}{{ .Version }}
    # only the binary, no README/LICENSE (same as before)
    files:
      - none*

# not published before; keep the asset list unchanged
checksum:
  disable: true

changelog:
  disable: true

snapshot:
  version_template: '{{ envOrDefault "NOVA_VERSION" "0.0.0" }}-snapshot'

release:
  github:
    owner: wandelbotsgmbh
    name: nova-cli
  # semantic-release already created the release with notes, as a draft so
  # `releases/latest` never points at a release without archives (consumers
  # like install_nova.sh and CI pipelines download from it). GoReleaser picks the
  # draft up by name (== tag), uploads, then publishes it.
  use_existing_draft: true
  draft: false
  # x.y.z-rc.N (from main) stay GitHub prereleases, so `releases/latest` (and
  # install_nova.sh) only ever resolve to stable versions
  prerelease: auto
  mode: keep-existing
  replace_existing_artifacts: true
